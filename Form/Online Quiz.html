<!DOCTYPE html>
<html>
<head>
<title>Simple Quiz</title>
<style>
  body { font-family: Arial; text-align: center; }
  .box { max-width: 500px; margin: auto; text-align: left; }
</style>
</head>
<body>

<div class="box" id="login" style="text-align:center">
  <h2>Login to Start Quiz</h2>
  <input type="text" id="name" placeholder="Enter your name">
  <button onclick="start()">Start</button>
</div>

<div class="box" id="quiz" style="display:none">
  <h2 id="hello"></h2>
  <div id="quizBox"></div>
  <button onclick="submitQuiz()">Submit</button>
  <h3 id="result"></h3>
</div>

<script>
  var questions = [
    ["Which planet is known as the Red Planet?", ["Mars","Venus","Jupiter"], "Mars"],
    ["Which is the largest ocean?", ["Pacific","Atlantic","Indian"], "Pacific"],
    ["In which year did World War II end?", ["1945","1939","1950"], "1945"],
    ["What is the square root of 144?", ["12","14","10"], "12"],
    ["Who wrote 'Pride and Prejudice'?", ["Jane Austen","Mary Shelley","Emily Bronte"], "Jane Austen"],
    ["How many players in a football team on field?", ["11","9","10"], "11"],
    ["What is the chemical symbol for gold?", ["Au","Gd","Ag"], "Au"],
    ["Which is the smallest country in the world?", ["Vatican City","Monaco","Malta"], "Vatican City"],
    ["Who is known as the father of computers?", ["Charles Babbage","Alan Turing","Nikola Tesla"], "Charles Babbage"],
    ["What is the fastest land animal?", ["Cheetah","Lion","Horse"], "Cheetah"]
  ];

  function start() {
    var username = document.getElementById("name").value;
    if (username == "") { alert("Please enter your name"); return; }

    var html = "";
    for (var i = 0; i < questions.length; i++) {
      html += "<p>" + (i + 1) + ". " + questions[i][0] + "</p>";
      for (var j = 0; j < questions[i][1].length; j++) {
        var opt = questions[i][1][j];
        html += "<label><input type='radio' name='q" + i + "' value='" + opt + "'> " + opt + "</label><br>";
      }
    }
    document.getElementById("quizBox").innerHTML = html;
    document.getElementById("hello").innerHTML = "Welcome!, " + username + "!";
    document.getElementById("login").style.display = "none";
    document.getElementById("quiz").style.display = "block";
  }

  function submitQuiz() {
    var score = 0;
    for (var i = 0; i < questions.length; i++) {
      var selected = document.querySelector('input[name="q' + i + '"]:checked');
      if (selected && selected.value == questions[i][2]) score++;
    }
    document.getElementById("result").innerHTML = "You scored " + score + " out of " + questions.length + "!";
  }
</script>

</body>
</html>
