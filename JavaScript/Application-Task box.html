<!DOCTYPE html>
<html>
<head>
  <title>Task Deletion Confirmation & Feedback</title>
</head>
<body>

  <h2>Task Deletion Confirmation & Feedback</h2>
  <button onclick="deleteTask()">Delete Task</button>

  <script>
    function deleteTask() {

      // 1. Alert - inform user
      alert("You are about to delete a task.");

      // 2. Confirm - ask yes/no
      var isConfirmed = confirm("Are you sure you want to delete this task?");

      if (isConfirmed) {

        // 3. Prompt - ask for reason
        var reason = prompt("Please enter the reason for deletion:");

        if (reason == null || reason.trim() == "") {
          alert("No reason entered. Task deletion cancelled.");
        } else {
          alert("Task deleted successfully.\nReason: " + reason);
        }

      } else {
        alert("Task deletion cancelled by user.");
      }
    }
  </script>

</body>
</html>
